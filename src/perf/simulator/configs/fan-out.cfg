# Fan-out/fan-in: 16 concurrent request loops, each scattering 32 subtasks - 10us of
# compute plus a 200us io-like wait - and joining them. The scatter step's latency is
# the join time; the tail shows how well subtask clumps spread.

params {
    duration = 10s
    warmup = 2s
}

pipeline {
    clients {
        type = parallel
        count = 16

        request {
            type = loop

            scatter {
                type = parallel
                count = 32
                measure = 1

                work {
                    type = cpu
                    duration = 10us
                }

                io {
                    type = wait
                    duration = 200us
                    exponential = 1
                }
            }
        }
    }
}
