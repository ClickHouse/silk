# Closed-loop net-perf stall analog: each connection is one closed echo loop - every
# request crosses a real fiber handoff, echo work and stalls burn on the pool workers,
# and a per-connection Poisson clock marks requests with the stall payload at
# stall_rate, the StallScheduler analog. The pool runs with affinity and one worker
# per connection - the real server's handler-per-connection structure: a stall delays
# only its own connection's stream, and spreading the survivors of a stalled cpu is
# the scheduler's work-stealing, the phenomenon net-perf measures. Keep workers equal
# to connections - a smaller shared pool caps served-stall concurrency and locks
# over-capacity rows into an every-request-marked collapse the real engine does not
# have.
#
# The measured net-perf cases (work-stealing.md). Compare against the real rows with
# --cpus 0-15: the load percentages are relative to the real server's 16 pinned
# cores, and the connection fibers burn almost nothing, so 16 cpus is the faithful
# budget. The model carries no wire or syscall costs.
#   64%  (defaults)   1024 connections x 10Hz x 1ms - reads 1.83M vs real draws
#                     845-1576k (canonical 1333k)
#   160%              --param connections=256,stall_rate=100,workers=256 - reads 487k,
#                     inside the real 402-652k draw range, with the real signature:
#                     a fast body (p50 5us) under rare long stall episodes (max ~109ms)
#   baseline analog   --param stall_duration=0ns - reads 2.01M vs real 2054k
#   6.4%              --param stall_duration=100us
#   64%, low rate     --param stall_rate=1,stall_duration=10ms
#   64%, mid rate     --param stall_rate=5,stall_duration=2ms
#   64%, high rate    --param stall_rate=100,stall_duration=100us

params {
    duration = 10s
    warmup = 2s
    connections = 1024
    workers = 1024
    echo_work = 4us
    stall_rate = 10
    stall_duration = 1ms
    queue = 4096
}

pipeline {
    all {
        type = concurrent

        server {
            type = pool
            workers = $workers
            queue = $queue
            affinity = 1

            echo {
                type = cpu
                duration = $echo_work
            }
        }

        connections {
            type = parallel
            count = $connections

            echo {
                type = loop
                measure = 1

                call {
                    type = submit
                    pool = all.server
                    stall = $stall_duration
                    stall_rate = $stall_rate
                }
            }
        }
    }
}
