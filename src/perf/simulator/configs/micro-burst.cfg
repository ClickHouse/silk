# Micro-bursts: every 2ms fan out 256 fibers of 10us each - 2.56ms of work per 2ms
# period (about 8% of a 16-core fleet) arriving as one clump on the spawning
# processor. The burst step's latency is the fan-out-to-join time; stealing must
# spread each clump to keep it near 10us x 256 / width.

params {
    duration = 10s
    warmup = 2s
}

pipeline {
    bursts {
        type = loop
        period = 2ms

        burst {
            type = parallel
            count = 256
            measure = 1

            work {
                type = cpu
                duration = 10us
            }
        }
    }
}
