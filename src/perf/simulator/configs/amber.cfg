# Amber master commit path, inproc tier (accounts-demo.md): transfer fibers doing
# 13us of engine cpu around two commit handoffs - a prepare submit into the log-shard
# combiner pool and a durable submit into the strict-LSN collector. The loop is closed:
# workers combine every queued request up to the batch limit, so the per-batch stage
# costs amortize with in-flight depth and the commit park lengths emerge from queue
# depth instead of being calibrated per fiber count.
#
# The collector is the serial element that sets the plateau: one worker, 4us carried
# per record (fitted to the real 245k ceiling and the 36.4us single-fiber chain -
# pending a per-record measurement from amber) plus the 5us durable advance per batch.
# The 8 parallel flush-leader writes sit off the serial path and are negligible at
# these rates (~5% of one core), so they carry no stage of their own.
#
# Stage mapping:
#   transfers  - client fibers: engine work split around the two commit handoffs
#   shards     - 3 log-shard workers, one insertChanges per combined batch
#   collector  - the strict-LSN walker: per-record durable work and one advance per
#                combined batch; the completion wake is the durable release
#   deliveries / segments - per-segment tail readers and apply fibers; throughput
#                followers off the commit path, timer-paced at the 200-fiber rates
#   repair / auditor / restamp / spiller - periodic background ticks

params {
    duration = 10s
    warmup = 2s
    fibers = 200
    shard_batch = 64
    collector_batch = 64
    pack_wait = 5ms
    apply_wait = 200us
}

pipeline {
    all {
        type = concurrent

        shards {
            type = pool
            workers = 3
            batch = $shard_batch

            insert {
                type = cpu
                duration = 3us
            }
        }

        collector {
            type = pool
            workers = 1
            batch = $collector_batch

            advance {
                type = cpu
                duration = 5us
            }
        }

        transfers {
            type = parallel
            count = $fibers

            transaction {
                type = loop
                measure = 1

                modify {
                    type = cpu
                    duration = 7us
                }

                prepare {
                    type = submit
                    pool = all.shards
                }

                finalize {
                    type = cpu
                    duration = 6us
                }

                durable {
                    type = submit
                    pool = all.collector
                    stall = 4us
                }
            }
        }

        deliveries {
            type = parallel
            count = 8

            pack {
                type = loop

                arrival {
                    type = wait
                    duration = $pack_wait
                    exponential = 1
                }

                decode {
                    type = cpu
                    duration = 200us
                }
            }
        }

        segments {
            type = parallel
            count = 8

            apply {
                type = loop

                arrival {
                    type = wait
                    duration = $apply_wait
                    exponential = 1
                }

                records {
                    type = cpu
                    duration = 50us
                }
            }
        }

        repair {
            type = loop
            period = 1ms

            tick {
                type = cpu
                duration = 5us
            }
        }

        auditor {
            type = loop
            period = 100ms

            scan {
                type = cpu
                duration = 1ms
            }
        }

        restamp {
            type = loop
            period = 10ms

            stamp {
                type = cpu
                duration = 50us
            }
        }

        spiller {
            type = loop
            period = 1s

            sweep {
                type = cpu
                duration = 100us
            }
        }
    }
}
