# net-perf baseline analog: 1024 echo connections, 3us of per-message server work,
# 500us exponential think time - about 2M msg/s offered, about 38% of a 16-core fleet.
# The connection fibers all home on the spawning processor, like accepted connections.

params {
    duration = 10s
    warmup = 2s
}

pipeline {
    connections {
        type = parallel
        count = 1024

        message {
            type = loop
            measure = 1

            think {
                type = wait
                duration = 500us
                exponential = 1
            }

            echo {
                type = cpu
                duration = 3us
            }
        }
    }
}
