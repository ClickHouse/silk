# Load steps for the width adaptation: 5s of heavy uniform load (512 fibers, ~63% of
# a 16-core fleet), 5s of near-idle load (16 fibers), then heavy again. The width
# must shed on the drop and regrow on the return - a regrow the vote suppression
# must not block.

params {
    duration = 16s
    warmup = 1s
}

pipeline {
    heavy1 {
        type = parallel
        count = 512

        work {
            type = loop
            duration = 5s
            measure = 1

            compute {
                type = cpu
                duration = 2us
            }

            think {
                type = wait
                duration = 100us
                exponential = 1
            }
        }
    }

    light {
        type = parallel
        count = 16

        work {
            type = loop
            duration = 5s
            measure = 1

            compute {
                type = cpu
                duration = 2us
            }

            think {
                type = wait
                duration = 1ms
                exponential = 1
            }
        }
    }

    heavy2 {
        type = parallel
        count = 512

        work {
            type = loop
            duration = 5s
            measure = 1

            compute {
                type = cpu
                duration = 2us
            }

            think {
                type = wait
                duration = 100us
                exponential = 1
            }
        }
    }
}
