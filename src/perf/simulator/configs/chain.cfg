# Closed dependent-wake loops: 8 rings of 64 fibers passing one token, 500ns of work
# per hop. Ring queueing shows as suspend wait, never as backlog age - the scenario
# the width vote targets. Rounds per second and per-round latency come from the ring
# step's report entry.

params {
    duration = 10s
    warmup = 2s
}

pipeline {
    rings {
        type = parallel
        count = 8

        ring {
            type = chain
            length = 64
            measure = 1

            hop {
                type = cpu
                duration = 500ns
            }
        }
    }
}
