# A client fleet calling a worker pool: each submitted request crosses a real fiber
# handoff - enqueue, worker doorbell, execution, completion wake - so the measured
# request latency is the full chain, and the loop is closed: clients wait completions,
# so saturation collapses the rate instead of stretching queues without bound.
#
# The measured cases, as --param overrides:
#   light (defaults)  256 clients over 16 workers at 5us work, ~6% pool load
#   saturated         --param clients=1024,work=50us,queue=2048 - work past pool capacity
#
# Size queue at or above the client count: backpressure then flows only through the
# completion waits, and no submitter parks on an admission-order-unfair full queue.

params {
    duration = 10s
    warmup = 2s
    clients = 256
    workers = 16
    queue = 1024
    work = 5us
    think = 100us
}

pipeline {
    all {
        type = concurrent

        server {
            type = pool
            workers = $workers
            queue = $queue

            handle {
                type = cpu
                duration = $work
            }
        }

        clients {
            type = parallel
            count = $clients

            request {
                type = loop
                measure = 1

                think {
                    type = wait
                    duration = $think
                    exponential = 1
                }

                call {
                    type = submit
                    pool = all.server
                }
            }
        }
    }
}
