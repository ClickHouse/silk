# Everything at once: closed wake rings, periodic micro-bursts, and a stalling
# steady background load, running concurrently - the scheduler must hold the rings'
# latency while spreading the bursts and absorbing the stalls.

params {
    duration = 10s
    warmup = 2s
}

pipeline {
    all {
        type = concurrent

        rings {
            type = parallel
            count = 4

            ring {
                type = chain
                length = 32
                measure = 1

                hop {
                    type = cpu
                    duration = 1us
                }
            }
        }

        bursts {
            type = loop
            period = 5ms

            burst {
                type = parallel
                count = 128
                measure = 1

                work {
                    type = cpu
                    duration = 5us
                }
            }
        }

        background {
            type = parallel
            count = 256

            message {
                type = loop
                measure = 1

                think {
                    type = wait
                    duration = 200us
                    exponential = 1
                }

                stall {
                    type = maybe
                    probability = 0.001

                    burn {
                        type = cpu
                        duration = 2ms
                    }
                }

                echo {
                    type = cpu
                    duration = 2us
                }
            }
        }
    }
}
